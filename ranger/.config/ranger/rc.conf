set colorscheme default
set column_ratios 1,3,4
set preview_directories true
set preview_files true

map h move left=1
map j move down=1
map k move up=1
map l move right=1

map q quit

map : console

map cw console rename 

map re source ~/.config/ranger/rc.conf

map <CR> move right=1
map <Enter> move right=1

map <BS> move left=1
map <BACKSPACE> move left=1

map mm cut
map yy copy
map pp paste
map dd delete

map M console mkdir

map <space> mark_files toggle=True

set preview_images True
set preview_images_method ueberzug

map Uu console shell unzip %f
